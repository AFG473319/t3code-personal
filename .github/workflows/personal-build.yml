name: personal-build

# Personal T3 Code build: any upstream T3 Code version + the tiny personal
# patch (20s OpenCode version probe, T3 Code Personal identity), packaged as
# a Windows installer that updates itself from this fork's releases.
#
# Everything else flows in normally from upstream:
# - Daily schedule: builds the newest upstream stable when it changes.
# - Manual dispatch: build stable, nightly, or pin an exact tag/SHA.
#
# Each upstream version gets its own fork release, `personal-<upstream-tag>`
# (e.g. `personal-v0.0.42`), with the installer attached — just like the
# original project. Install one published build by hand; after that the app
# auto-updates from these releases. The official T3 Code install is
# untouched: different app id, different feed.
#
# To force a rebuild of an already-published upstream version (e.g. after a
# patch refresh), delete that fork release first; the next run rebuilds it.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Upstream line to build on"
        required: true
        default: stable
        type: choice
        options: [stable, nightly]
      ref:
        description: "Exact upstream tag or full SHA (overrides channel)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: personal-build
  cancel-in-progress: false

jobs:
  check:
    name: Check for new upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      ref: ${{ steps.resolve.outputs.ref }}
      fork_tag: ${{ steps.resolve.outputs.fork_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: resolve
        name: Resolve upstream ref
        shell: bash
        run: |
          set -euo pipefail
          channel="${{ inputs.channel }}"
          if [[ "${{ github.event_name }}" == "schedule" || -z "$channel" ]]; then
            channel="stable"
          fi
          if [[ -n "${{ inputs.ref }}" ]]; then
            ref="${{ inputs.ref }}"
          elif [[ "$channel" == "nightly" ]]; then
            # Newest 100 releases always contain the newest nightly (upstream
            # ships several a day); one request, no pipe, no SIGPIPE.
            ref=$(gh api 'repos/pingdotgg/t3code/releases?per_page=100' --jq '[.[] | select(.prerelease and (.tag_name | contains("-nightly.")))] | .[0].tag_name // empty')
          else
            ref=$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)
          fi
          if [[ -z "$ref" ]]; then
            echo "Could not resolve an upstream ref." >&2
            exit 1
          fi
          fork_tag="personal-$ref"
          if [[ "$ref" == *"-nightly."* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi
          echo "Upstream ref: $ref -> fork release: $fork_tag (prerelease: $prerelease)"
          {
            echo "ref=$ref"
            echo "fork_tag=$fork_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - id: check
        name: Skip if already published
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.resolve.outputs.fork_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Fork release ${{ steps.resolve.outputs.fork_tag }} already exists; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No fork release for ${{ steps.resolve.outputs.ref }} yet; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  win-x64:
    name: Personal Windows x64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout upstream and apply personal patch
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add upstream "${GITHUB_SERVER_URL}/pingdotgg/t3code.git"
          git fetch --no-tags --depth=1 upstream "${{ needs.check.outputs.ref }}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout "$(git rev-parse 'FETCH_HEAD^{commit}')"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/personal/personal.patch" -o /tmp/personal.patch
          git apply --check /tmp/personal.patch
          git apply --stat /tmp/personal.patch
          git apply /tmp/personal.patch

      - name: Resolve build version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./apps/server/package.json').version")
          # Nightly-line builds keep the -nightly. stamp so the app reports
          # the Nightly channel (product name, icons, updater feed) matching
          # the prerelease they publish to; stable builds use -personal. so
          # the updater follows the stable fork releases. Neither matches the
          # -preview. pattern, so an update feed is always emitted.
          if [[ "${{ needs.check.outputs.prerelease }}" == "true" ]]; then
            version="$base-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          else
            version="$base-personal.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "Build version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        # Full install (like upstream CI): the recursive typecheck touches
        # every workspace, e.g. apps/marketing needs its astro binary.
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Typecheck
        run: vp run typecheck

      # NOTE: bootService.test.ts is deliberately not gated here. Upstream's
      # own windows-tests.yml header states "nothing in the suite passes on
      # Windows yet": 3 of its tests fail on Windows runners for pre-existing
      # environmental reasons (ExecStart path quoting, pinned-runtime
      # verification), unrelated to the personal patch — the 35 other tests,
      # including every unit/plist rendering test covering the renamed
      # t3code-personal service, pass. Upstream CI runs this suite on Linux.
      - name: Test patched server suite
        working-directory: apps/server
        run: vp test run src/provider/Layers/OpenCodeProvider.test.ts

      - name: Test patched desktop suites
        working-directory: apps/desktop
        run: vp test run src/app/DesktopEnvironment.test.ts src/app/DesktopAppIdentity.test.ts src/app/DesktopClerk.test.ts src/app/DesktopPreReadyPlatform.test.ts src/app/DesktopEarlyElectronStartup.test.ts

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Build Windows installer
        shell: bash
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "${{ steps.ver.outputs.version }}" --verbose

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: t3-code-personal-win-x64
          path: release/*
          if-no-files-found: error

      - name: Publish fork release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.fork_tag }}"
          if [[ "${{ needs.check.outputs.prerelease }}" == "true" ]]; then
            pre="--prerelease"
          else
            pre=""
          fi
          # Delete-then-create: a previous partial publish (e.g. a flaked
          # big-asset upload) must not block the completed build.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          # shellcheck disable=SC2086
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "T3 Code Personal ${{ steps.ver.outputs.version }}" \
            --notes "Personal build of pingdotgg/t3code@${{ needs.check.outputs.ref }}: identical except the 20s OpenCode version probe and the T3 Code Personal identity (side-by-side installable with official T3 Code). Install once; the app auto-updates from these fork releases afterwards." \
            $pre
