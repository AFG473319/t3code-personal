name: personal-build

# Personal T3 Code build: any upstream T3 Code version + the tiny personal
# patch (20s OpenCode version probe, T3 Code Personal identity), packaged as
# a Windows installer that updates itself from this fork's rolling releases.
#
# Everything else flows in normally from upstream:
# - Daily schedule: builds the newest upstream stable when it changes.
# - Manual dispatch: build stable, nightly, or pin an exact tag/SHA.
#
# Install one published build by hand; after that the app auto-updates from
# the `personal-stable` (or `personal-nightly`) release on this fork. The
# official T3 Code install is untouched: different app id, different feed.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Upstream line to build on"
        required: true
        default: stable
        type: choice
        options: [stable, nightly]
      ref:
        description: "Exact upstream tag or full SHA (overrides channel)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: personal-build
  cancel-in-progress: false

jobs:
  check:
    name: Check for new upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      roll_tag: ${{ steps.resolve.outputs.roll_tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: resolve
        name: Resolve upstream ref
        shell: bash
        run: |
          set -euo pipefail
          channel="${{ inputs.channel }}"
          if [[ "${{ github.event_name }}" == "schedule" || -z "$channel" ]]; then
            channel="stable"
          fi
          if [[ -n "${{ inputs.ref }}" ]]; then
            ref="${{ inputs.ref }}"
          elif [[ "$channel" == "nightly" ]]; then
            ref=$(gh api repos/pingdotgg/t3code/releases --paginate --jq '[.[] | select(.prerelease and (.tag_name | contains("-nightly.")))] | .[0].tag_name')
          else
            ref=$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name)
          fi
          if [[ -z "$ref" ]]; then
            echo "Could not resolve an upstream ref." >&2
            exit 1
          fi
          if [[ "$channel" == "nightly" ]]; then
            roll_tag="personal-nightly"
            prerelease="true"
          else
            roll_tag="personal-stable"
            prerelease="false"
          fi
          base="${ref#v}"
          base="${base%%-*}"
          echo "Upstream ref: $ref (channel: $channel, roll: $roll_tag)"
          {
            echo "ref=$ref"
            echo "roll_tag=$roll_tag"
            echo "prerelease=$prerelease"
            echo "version=$base-personal.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - id: check
        name: Skip if already built
        shell: bash
        run: |
          set -euo pipefail
          body=$(gh release view "${{ steps.resolve.outputs.roll_tag }}" --json body --jq .body 2>/dev/null || true)
          built=$(printf '%s\n' "$body" | grep -m1 '^Upstream: ' | cut -d' ' -f2 || true)
          if [[ -n "$built" && "$built" == "${{ steps.resolve.outputs.ref }}" ]]; then
            echo "Rolling release already built from ${{ steps.resolve.outputs.ref }}; skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building ${{ steps.resolve.outputs.ref }} (previous: ${built:-none})."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  win-x64:
    name: Personal Windows x64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout upstream and apply personal patch
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add upstream "${GITHUB_SERVER_URL}/pingdotgg/t3code.git"
          git fetch --no-tags --depth=1 upstream "${{ needs.check.outputs.ref }}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout "$(git rev-parse 'FETCH_HEAD^{commit}')"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/personal/personal.patch" -o /tmp/personal.patch
          git apply --check /tmp/personal.patch
          git apply --stat /tmp/personal.patch
          git apply /tmp/personal.patch

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        # Full install (like upstream CI): the recursive typecheck touches
        # every workspace, e.g. apps/marketing needs its astro binary.
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Typecheck
        run: vp run typecheck

      - name: Test patched server suites
        working-directory: apps/server
        run: vp test run src/provider/Layers/OpenCodeProvider.test.ts src/cloud/bootService.test.ts

      - name: Test patched desktop suites
        working-directory: apps/desktop
        run: vp test run src/app/DesktopEnvironment.test.ts src/app/DesktopAppIdentity.test.ts src/app/DesktopClerk.test.ts src/app/DesktopPreReadyPlatform.test.ts src/app/DesktopEarlyElectronStartup.test.ts

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Build Windows installer
        shell: bash
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "${{ needs.check.outputs.version }}" --verbose

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: t3-code-personal-win-x64
          path: release/*
          if-no-files-found: error

      - name: Publish rolling release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.roll_tag }}"
          if [[ "${{ needs.check.outputs.prerelease }}" == "true" ]]; then
            pre="--prerelease"
            title="T3 Code Personal nightly ${{ needs.check.outputs.version }}"
          else
            pre=""
            title="T3 Code Personal ${{ needs.check.outputs.version }}"
          fi
          gh release delete "$tag" --cleanup-tag --yes || true
          # shellcheck disable=SC2086
          gh release create "$tag" release/* \
            --title "$title" \
            --notes "Upstream: ${{ needs.check.outputs.ref }} plus the personal patch (20s OpenCode version probe, T3 Code Personal identity)." \
            $pre
